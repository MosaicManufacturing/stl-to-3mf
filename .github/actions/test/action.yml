name: Unit tests   
description: Runs Unit tests and Snapshots
inputs:
  deploy-env:
    description: DEPLOY_ENV
    type: string
    required: true
runs:
  using: composite
  steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Download dependencies
        run: go mod download
      - name: Run tests with snapshots
        run: go test -v